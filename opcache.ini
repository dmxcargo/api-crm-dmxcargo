; OPcache: betting bootstrap Laravel tetap cepat walau source di-bind-mount.
; validate_timestamps=1 + revalidate_freq=2 => edit file di host kepickup
; maksimal 2 detik kemudian (aman untuk dev). Produksi boleh set
; validate_timestamps=0 + restart container tiap deploy.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1
; realpath cache per-proses: Laravel menyentuh ratusan file kecil per request
; lewat bind-mount; cache besar menghilangkan stat berulang di tiap worker.
realpath_cache_size=4096K
realpath_cache_ttl=600
