$kind: http-request
url: "{{baseUrl}}/archives"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "owner": "",
      "dateFrom": "2026-10-01",
      "dateTo": "2026-10-31"
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j.data && j.data.id) { pm.collectionVariables.set("archiveId", j.data.id); }
    language: text/javascript
order: 2000
