$kind: http-request
name: Purge arsip (terkunci config + salinan kedua + retensi + approval)
url: "{{baseUrl}}/archives/:archive/purge"
method: POST
headers:
  Content-Type: application/json
pathVariables:
  archive: "{{archiveId}}"
body:
  type: json
  content: |-
    {
      "approved": true
    }
order: 8000
