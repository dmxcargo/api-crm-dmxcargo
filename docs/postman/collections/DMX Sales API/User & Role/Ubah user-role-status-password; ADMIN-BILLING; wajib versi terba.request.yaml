$kind: http-request
name: Ubah user/role/status/password; ADMIN/BILLING; wajib versi terbaru
url: "{{baseUrl}}/users/:user"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  user: "{{userId}}"
body:
  type: json
  content: |-
    {
      "name": "Contoh",
      "username": "sales.baru",
      "email": "contoh@example.test",
      "password": "Uat-Pass-123456",
      "role": "ADMIN",
      "isActive": true,
      "version": 1
    }
order: 4000
