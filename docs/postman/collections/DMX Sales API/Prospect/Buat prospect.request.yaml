$kind: http-request
url: "{{baseUrl}}/prospects"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "accountName": "PT Contoh Logistik",
      "phone": "081234567890",
      "email": "contoh@example.test",
      "picName": "string",
      "picPosition": "string",
      "city": "Jakarta",
      "province": "DKI Jakarta",
      "sourceCode": "GOOGLE_ADS",
      "industryCode": "LOGISTIK",
      "stage": "FOLLOW_UP",
      "priority": "WARM",
      "entryDate": "2026-10-05",
      "nextFollowUpAt": "2026-10-20T09:00:00+07:00",
      "nextAction": "string",
      "lastProgress": "string",
      "notes": "string",
      "potentialValue": 15000000,
      "paymentStatus": "string",
      "customerType": "B2B",
      "legacyId": "string",
      "legacySourceRow": 1
    }
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j.data && j.data.id) { pm.collectionVariables.set("prospectId", j.data.id); }
    language: text/javascript
order: 2000
